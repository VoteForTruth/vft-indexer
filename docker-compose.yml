# docker compose up -d   (set VFT_MASTER, optionally VFT_NETWORK=mainnet)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vft_indexer
      POSTGRES_USER: vft
      POSTGRES_PASSWORD: vft
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vft -d vft_indexer"]
      interval: 5s
      retries: 10

  indexer:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VFT_NETWORK: ${VFT_NETWORK:-testnet}
      VFT_MASTER: ${VFT_MASTER:?set VFT_MASTER}
      VFT_DSN: postgres://vft:vft@postgres/vft_indexer?sslmode=disable
      VFT_HTTP: ":8080"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
